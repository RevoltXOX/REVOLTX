<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Контакты - Профессиональный сайт</title>
  <meta name="description" content="Свяжитесь с нами для получения дополнительной информации и сотрудничества.">
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <header>
    <div class="container header-container">
      <div class="logo">
        <a href="index.html">LOGO</a>
      </div>
      <nav class="nav">
        <ul class="nav-list">
          <li><a href="index.html">Главная</a></li>
          <li><a href="about.html">О нас</a></li>
          <li><a href="services.html">Услуги</a></li>
          <li><a href="portfolio.html">Портфолио</a></li>
          <li><a href="contact.html" class="active">Контакты</a></li>
        </ul>
      </nav>
      <div>
        <button id="themeToggle" class="theme-toggle">Темная тема</button>
        <div class="nav-toggle" id="navToggle">
          <span class="hamburger"></span>
        </div>
      </div>
    </div>
  </header>
  
  <main>
    <section class="contact-section">
      <div class="container">
        <h1>Свяжитесь с нами</h1>
        <form action="#" class="contact-form" novalidate>
          <div class="form-group">
            <label for="name">Имя</label>
            <input type="text" id="name" placeholder="Ваше имя" required>
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Ваш email" required>
          </div>
          <div class="form-group">
            <label for="message">Сообщение</label>
            <textarea id="message" rows="5" placeholder="Ваше сообщение" required></textarea>
          </div>
          <button type="submit" class="btn">Отправить</button>
        </form>
      </div>
    </section>
  </main>
  
  <footer>
    <div class="container footer-container">
      <p>&copy; 2025 Профессиональный сайт. Все права защищены.</p>
    </div>
  </footer>
  
  <script src="assets/js/script.js"></script>
  <script>
    // Простая клиентская валидация для демонстрации (реализация отправки должна быть на сервере)
    const contactForm = document.querySelector('.contact-form');
    contactForm.addEventListener('submit', function(e) {
      e.preventDefault();
      alert('Форма отправлена! (Эмуляция отправки)');
      contactForm.reset();
    });
  </script>
</body>
</html>
